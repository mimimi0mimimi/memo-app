<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>「あとでやる」スワイプ付箋メモ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="超特急メモ">
  <meta name="theme-color" content="#f3f0ff">
  <link id="pwa-manifest" rel="manifest">
  <link id="apple-icon" rel="apple-touch-icon">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f3f0ff;
      color: #1a1a2e;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 5% 5%,   rgba(167,139,250,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 95% 95%,  rgba(251,191,36,0.22)  0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 80% 15%,  rgba(244,114,182,0.18) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Main Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding-top: max(env(safe-area-inset-top, 0px), 10px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 10px);
      padding-left: 12px;
      padding-right: 12px;
      gap: 8px;
      position: relative;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    #header-title {
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      background: #fff;
      border: none;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c3aed;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(124,58,237,0.15);
    }
    .icon-btn:active { background: #ede9fe; transform: scale(0.95); }
    
    #add-trigger-btn {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }

    /* ── Canvas Area ── */
    #canvas-container {
      flex: 1;
      position: relative;
      background: rgba(255, 255, 255, 0.4);
      border: 2px dashed #e8e0ff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(124,58,237,0.05);
    }

    /* ── Sticky Note (付箋) ── */
    .sticky-note {
      position: absolute;
      width: 140px;
      min-height: 110px;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 6px 16px rgba(124,58,237,0.12);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 6px solid #a78bfa;
      transition: transform 0.05s linear, box-shadow 0.1s;
      z-index: 5;
    }
    .sticky-note.dragging {
      cursor: grabbing;
      box-shadow: 0 14px 28px rgba(124,58,237,0.25);
      z-index: 99;
    }
    .sticky-note-text {
      font-size: 13px;
      line-height: 1.4;
      color: #1a1a2e;
      word-break: break-all;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      user-select: none;
    }
    .sticky-note-meta {
      font-size: 9px;
      color: #a78bfa;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── 3大特殊フォルダ (吸い込み領域) ── */
    #folder-area {
      display: flex;
      gap: 10px;
      padding: 6px 2px;
      flex-shrink: 0;
      z-index: 10;
    }

    .folder-box {
      flex: 1;
      height: 76px;
      background: #fff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    #folder-archive { border-bottom: 4px solid #22c55e; }
    #folder-later { border-bottom: 4px solid #3b82f6; }
    #folder-trash { border-bottom: 4px solid #ef4444; }
    
    #folder-archive.drag-over { background-color: #e8f5e9; border-color: #22c55e; transform: scale(1.06); }
    #folder-later.drag-over { background-color: #e3f2fd; border-color: #3b82f6; transform: scale(1.06); }
    #folder-trash.drag-over { background-color: #ffebee; border-color: #ef4444; transform: scale(1.06); }

    .folder-emoji { font-size: 24px; }
    .folder-label { font-size: 11px; font-weight: 800; color: #4c4c6d; text-align: center; }
    .folder-hint { font-size: 8px; color: #a78bfa; font-weight: normal; margin-top: -2px; }

    /* ── Input Modal ── */
    #input-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #input-modal.open { opacity: 1; pointer-events: all; }

    #input-card {
      width: 100%;
      background: #f8f5ff;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94);
    }
    #input-modal.open #input-card { transform: translateY(0); }

    #memo-input {
      width: 100%;
      height: 100px;
      padding: 12px 14px;
      background: #fff;
      border: 2px solid #e8e0ff;
      border-radius: 14px;
      color: #1a1a2e;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      -webkit-appearance: none;
      user-select: text;
    }
    #memo-input:focus { border-color: #a78bfa; }

    /* カテゴリ事前選択チップ */
    .cat-selector-label {
      font-size: 11px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 8px 2px;
    }
    #modal-cat-pickers {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none;
    }
    #modal-cat-pickers::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0; padding: 10px 16px; background: #fff; border: 2px solid #e8e0ff; border-radius: 50px;
      font-size: 14px; font-weight: 700; color: #4c4c6d; cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; gap: 4px; transition: all 0.1s;
    }
    .cat-chip:active { transform: scale(0.95); }

    .modal-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    .modal-btn.cancel { padding: 10px 20px; border: none; background: transparent; color: #a78bfa; font-size: 14px; font-weight: 600; cursor: pointer; }

    /* ── Slide Panels ── */
    .panel {
      position: fixed;
      top: 0; bottom: 0; width: 100%; background: #f8f5ff; z-index: 2000; overflow-y: auto; -webkit-overflow-scrolling: touch;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: max(env(safe-area-inset-top, 0px), 14px); padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px); padding-left: 16px; padding-right: 16px;
    }
    #settings-panel { right: 0; transform: translateX(100%); }
    #settings-panel.open { transform: translateX(0); }
    #history-panel  { left: 0;  transform: translateX(-100%); }
    #history-panel.open  { transform: translateX(0); }

    .panel-header { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 2px solid #ede8ff; margin-bottom: 6px; position: sticky; top: 0; background: #f8f5ff; z-index: 1; padding-top: 4px; }
    .panel-title { flex: 1; font-size: 20px; font-weight: 800; color: #1a1a2e; }
    .back-btn { width: 38px; height: 38px; background: #fff; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #7c3aed; touch-action: manipulation; flex-shrink: 0; box-shadow: 0 2px 10px rgba(124,58,237,0.12); }

    /* Settings Details */
    .section-label { font-size: 11px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.12em; margin: 22px 0 10px 4px; }
    .cat-row { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 2px 12px rgba(124,58,237,0.08); }
    .cat-swatch { width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
    .color-field { display: flex; gap: 8px; align-items: center; }
    .color-picker { width: 42px; height: 36px; border: none; border-radius: 10px; padding: 2px 3px; cursor: pointer; background: #f3f0ff; flex-shrink: 0; -webkit-appearance: none; outline: none; }
    .color-hex { font-family: 'SF Mono', Menlo, monospace; font-size: 14px; letter-spacing: 0.04em; }
    .cat-fields { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-label { font-size: 10px; color: #a78bfa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .field-input { background: #f3f0ff; border: none; border-radius: 10px; padding: 9px 11px; color: #1a1a2e; font-size: 15px; font-family: inherit; outline: none; width: 100%; user-select: text; -webkit-appearance: none; transition: background 0.15s; }
    .field-input:focus { background: #ede9fe; }
    .del-btn { width: 30px; height: 30px; background: #fee2e2; border: none; border-radius: 50%; color: #f87171; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 10px; }
    .daily-hint { font-size: 12px; color: #a78bfa; margin: -4px 0 10px 2px; }
    .daily-row { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 12px rgba(124,58,237,0.08); }
    .daily-cat-select { background: #f3f0ff; border: none; border-radius: 10px; padding: 8px 10px; color: #1a1a2e; font-size: 14px; font-family: inherit; outline: none; appearance: none; -webkit-appearance: none; }
    .daily-del-btn { width: 28px; height: 28px; background: #fee2e2; border: none; border-radius: 50%; color: #f87171; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #add-cat-btn { width: 100%; padding: 15px; background: transparent; border: 2px dashed #c4b5fd; border-radius: 18px; color: #a78bfa; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 2px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 14px; padding: 15px 16px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(124,58,237,0.07); }
    .toggle-label { font-size: 15px; color: #1a1a2e; font-weight: 500; }
    .toggle { width: 50px; height: 28px; background: #e0d9f7; border-radius: 14px; border: none; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .toggle.on { background: #22c55e; }
    .toggle::after { content: ''; position: absolute; width: 22px; height: 22px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .toggle.on::after { transform: translateX(22px); }
    .webhook-hint { font-size: 12px; color: #7c6aad; background: #f3f0ff; border-radius: 12px; padding: 12px 14px; margin-top: -2px; line-height: 1.6; border-left: 3px solid #a78bfa; }
    #save-btn { width: 100%; padding: 17px; background: linear-gradient(135deg, #7c3aed, #6d28d9); border: none; border-radius: 18px; color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 28px; box-shadow: 0 6px 24px rgba(124,58,237,0.35); }

    /* History Details */
    .h-item { background: #fff; border-radius: 16px; padding: 12px 13px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 2px 12px rgba(124,58,237,0.07); }
    .h-badge { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .h-body { flex: 1; min-width: 0; }
    .h-text { font-size: 14px; color: #1a1a2e; line-height: 1.45; word-break: break-all; user-select: text; }
    .h-meta { font-size: 11px; color: #a78bfa; margin-top: 4px; font-weight: 500; }
    .h-action-btns { display: flex; flex-direction: column; gap: 4px; }
    .h-btn-small { width: 30px; height: 30px; border: none; border-radius: 9px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: manipulation; }
    .h-copy { background: #f3f0ff; color: #7c3aed; }
    .h-del { background: #fef2f2; color: #f87171; }
    .h-restore { background: #e0f2fe; color: #0284c7; }
    .date-sep { font-size: 11px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 8px 2px; }
    .h-empty { text-align: center; color: #c4b5fd; font-size: 15px; padding: 50px 0; line-height: 2; }
    .export-btn { padding: 8px 12px; background: #ede9fe; border: none; border-radius: 10px; color: #7c3aed; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .clear-btn { padding: 8px 14px; background: #fee2e2; border: none; border-radius: 9px; color: #f87171; font-size: 13px; font-weight: 600; cursor: pointer; }

    /* Sync Details */
    .sync-box { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 2px 12px rgba(124,58,237,0.08); display: flex; flex-direction: column; gap: 10px; }
    .sync-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync-btn { padding: 10px 20px; background: #7c3aed; border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
    .sync-btn.secondary { background: #f3f0ff; color: #7c3aed; }
    #sync-status { font-size: 12px; color: #a78bfa; flex: 1; text-align: right; min-width: 0; }
    .sync-gist-id-row { display: flex; align-items: center; gap: 6px; }
    .sync-gist-id-row .field-input { flex: 1; }
    .copy-gist-btn { padding: 9px 12px; background: #f3f0ff; border: none; border-radius: 10px; color: #7c3aed; font-size: 14px; cursor: pointer; flex-shrink: 0; }
    #build-stamp { text-align: center; font-size: 10px; color: #c4b5fd; margin-top: 12px; letter-spacing: 0.05em; }

    /* History Filters */
    #history-filters { padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid #ede8ff; }
    .filter-section { margin-bottom: 10px; }
    .filter-label { font-size: 10px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; padding-left: 2px; }
    .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill { flex-shrink: 0; padding: 7px 16px; background: #fff; border: 2px solid #e8e0ff; border-radius: 50px; font-size: 13px; font-weight: 600; color: #7c6aad; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .filter-pill.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }

    .h-check { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 2px solid #d4c8f7; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; align-self: center; flex-shrink: 0; cursor: pointer; }
    .h-check.checked { background: #22c55e; border-color: #22c55e; }
    .h-item.done { background: #faf8ff; }
    .h-item.done .h-text { text-decoration: line-through; color: #b0a8cc; }
    .h-item.done .h-badge { opacity: 0.5; }
  </style>
</head>
<body>

<div id="app">
  <div id="header">
    <button class="icon-btn" id="history-btn" aria-label="履歴">📋</button>
    <div id="header-title">「あとでやる」スワイプ超特急</div>
    <button class="icon-btn" id="add-trigger-btn" aria-label="メモ追加">＋</button>
    <button class="icon-btn" id="settings-btn" aria-label="設定">⚙️</button>
  </div>

  <div id="canvas-container"></div>

  <div id="folder-area">
    <div class="folder-box" id="folder-archive">
      <span class="folder-emoji">📥</span>
      <span class="folder-label">アーカイブ</span>
      <span class="folder-hint">完了（裏へ退避）</span>
    </div>
    <div class="folder-box" id="folder-later">
      <span class="folder-emoji">⏳</span>
      <span class="folder-label">あとで</span>
      <span class="folder-hint">Wクリックで復元</span>
    </div>
    <div class="folder-box" id="folder-trash">
      <span class="folder-emoji">🗑️</span>
      <span class="folder-label">ゴミ箱</span>
      <span class="folder-hint">完全に削除</span>
    </div>
  </div>
</div>

<div id="input-modal" role="dialog" aria-modal="true">
  <div id="input-card">
    <textarea id="memo-input" placeholder="思いついたこと、ここに…" rows="4" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true"></textarea>
    
    <div class="cat-selector-label">カテゴリをタップしてキャンバスへ貼る</div>
    <div id="modal-cat-pickers"></div>

    <div class="modal-actions">
      <button class="modal-btn cancel" id="input-cancel-btn">閉じる</button>
    </div>
  </div>
</div>

<div id="settings-panel" class="panel" role="dialog" aria-label="設定">
  <div class="panel-header">
    <button class="back-btn" id="settings-back" aria-label="戻る">←</button>
    <span class="panel-title">設定</span>
  </div>

  <div class="section-label">カテゴリ</div>
  <div id="cat-settings-list"></div>
  <button id="add-cat-btn">＋ カテゴリを追加</button>

  <div class="section-label">📅 毎日追加</div>
  <div class="daily-hint">起動時に自動でキャンバスへ出現させます</div>
  <div id="daily-settings-list"></div>
  <button id="add-daily-btn">＋ 追加</button>

  <div class="section-label">動作</div>
  <div class="toggle-row">
    <span class="toggle-label">バイブレーション</span>
    <button class="toggle on" id="vib-toggle" aria-label="バイブレーション切替"></button>
  </div>

  <div class="section-label">☁️ クラウド同期（GitHub Gist）</div>
  <div class="sync-box">
    <div class="field-group">
      <div class="field-label">GitHub Personal Access Token</div>
      <input type="password" id="sync-token" class="field-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-group">
      <div class="field-label">Gist ID</div>
      <div class="sync-gist-id-row">
        <input type="text" id="sync-gist-id" class="field-input" placeholder="自動生成または貼り付け" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="copy-gist-btn" id="copy-gist-btn" title="コピー">📋</button>
      </div>
    </div>
    <div class="sync-actions">
      <button class="sync-btn" id="sync-push-btn">↑ 送信</button>
      <button class="sync-btn secondary" id="sync-pull-btn">↓ 取得</button>
      <button class="sync-btn secondary" id="sync-reset-btn" title="新規Gist作成">↺ リセット</button>
      <span id="sync-status">未設定</span>
    </div>
  </div>

  <button id="save-btn">✓ 保存する</button>
  <div id="build-stamp"></div>
</div>

<div id="history-panel" class="panel" role="dialog" aria-label="履歴">
  <div class="panel-header">
    <button class="back-btn" id="history-back" aria-label="戻る">←</button>
    <span class="panel-title">履歴 / 管理</span>
    <button class="export-btn" id="export-btn" title="完了済みをCSVエクスポート">📥 CSV</button>
    <button class="clear-btn" id="clear-btn">完了を削除</button>
  </div>
  <div id="history-filters"></div>
  <div id="history-list"></div>
</div>

<script>
'use strict';

// ── Color helpers ─────────────────────────────────────────────────────────────
function darkenColor(hex, factor = 0.72) {
  const h = hex.replace('#', '');
  const r = Math.round(parseInt(h.slice(0,2), 16) * factor);
  const g = Math.round(parseInt(h.slice(2,4), 16) * factor);
  const b = Math.round(parseInt(h.slice(4,6), 16) * factor);
  return '#' + [r,g,b].map(v => Math.min(255,v).toString(16).padStart(2,'0')).join('');
}
function colorToBg(hex) { return `linear-gradient(135deg, ${hex}, ${darkenColor(hex)})`; }
function extractColor(bg) { const m = (bg || '').match(/#[0-9a-fA-F]{6}/); return m ? m[0] : '#7c3aed'; }
function isValidHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }

// ── Render Canvas ────────────────────────────────────────────────────────────
function renderCanvas() {
  canvasContainer.innerHTML = '';
  const activeNotes = history.filter(item => !item.done && !item.later);

  if (activeNotes.length === 0) {
    const hint = document.createElement('div');
    hint.style.cssText = 'position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#c4b5fd; font-size:13px; font-weight:600; text-align:center; padding:20px; pointer-events:none; line-height:1.6;';
    hint.innerHTML = 'キャンバスはピカピカです！<br>右上「＋」ボタンから新しいメモを追加、<br>または「あとで」フォルダをWクリックで復元。';
    canvasContainer.appendChild(hint);
    return;
  }

  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24;
  const cHeight = rect.height || 400;

  activeNotes.forEach(item => {
    if (item.x === undefined || item.y === undefined) {
      const pos = calculateInitialPosition(item.catId, cWidth, cHeight);
      item.x = pos.x; item.y = pos.y;
    }

    const note = document.createElement('div');
    note.className = 'sticky-note';
    note.dataset.id = item.id;
    note.style.left = `${item.x}px`;
    note.style.top = `${item.y}px`;
    
    const catData = cats.find(c => c.id === item.catId);
    if (catData && catData.color) {
      note.style.borderLeftColor = catData.color;
    }

    note.innerHTML = `
      <div class="sticky-note-text">${esc(item.text || '(空メモ)')}</div>
      <div class="sticky-note-meta">
        <span>${esc(item.catEmoji || '📌')} ${esc(item.catLabel || '未分類')}</span>
        <span>🕒 ${esc(new Date(item.ts).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }))}</span>
      </div>
    `;

    setupDragElement(note, item);
    canvasContainer.appendChild(note);
  });
}

function calculateInitialPosition(catId, canvasWidth, canvasHeight) {
  const catIndex = cats.findIndex(c => c.id === catId);
  const totalCats = cats.length || 1;
  const safeIndex = catIndex >= 0 ? catIndex : 0;
  
  const laneWidth = (canvasWidth - 150) / totalCats; 
  const targetX = Math.floor(10 + (safeIndex * laneWidth) + (Math.random() * (laneWidth * 0.4)));
  const targetY = Math.max(15, Math.floor(20 + Math.random() * (canvasHeight - 150)));
  
  return { x: targetX, y: targetY };
}

// ── Touch Drag Logic ──────────────────────────────────────────────────────────
function setupDragElement(el, item) {
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;
  let targetsData = [];

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    el.classList.add('dragging');
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    initialLeft = parseInt(el.style.left, 10) || 0;
    initialTop = parseInt(el.style.top, 10) || 0;

    targetsData = [
      { element: document.getElementById('folder-archive'), id: 'archive', rect: document.getElementById('folder-archive').getBoundingClientRect() },
      { element: document.getElementById('folder-later'),   id: 'later',   rect: document.getElementById('folder-later').getBoundingClientRect() },
      { element: document.getElementById('folder-trash'),   id: 'trash',   rect: document.getElementById('folder-trash').getBoundingClientRect() }
    ];

    if (prefs.vib && navigator.vibrate) navigator.vibrate(8);
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    const touch = e.touches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    let newLeft = initialLeft + dx;
    let newTop = initialTop + dy;

    const cRect = canvasContainer.getBoundingClientRect();
    if (newLeft < 0) newLeft = 0;
    if (newLeft > cRect.width - 140) newLeft = cRect.width - 140;
    if (newTop < 0) newTop = 0;
    if (newTop > cRect.height - 110) newTop = cRect.height - 110;

    el.style.left = `${newLeft}px`;
    el.style.top = `${newTop}px`;

    const currentX = touch.clientX;
    const currentY = touch.clientY;
    
    targetsData.forEach(tgt => {
      if (currentX >= tgt.rect.left && currentX <= tgt.rect.right &&
          currentY >= tgt.rect.top && currentY <= tgt.rect.bottom) {
        tgt.element.classList.add('drag-over');
      } else {
        tgt.element.classList.remove('drag-over');
      }
    });
  }, { passive: true });

  el.addEventListener('touchend', (e) => {
    el.classList.remove('dragging');
    
    let matchedTarget = null;
    targetsData.forEach(tgt => {
      if (tgt.element.classList.contains('drag-over')) {
        matchedTarget = tgt;
        tgt.element.classList.remove('drag-over');
      }
    });

    if (matchedTarget) {
      executeFolderAction(item.id, matchedTarget.id);
    } else {
      const found = history.find(h => h.id === item.id);
      if (found) {
        found.x = parseInt(el.style.left, 10);
        found.y = parseInt(el.style.top, 10);
        localStorage.setItem('memo_history', JSON.stringify(history));
        syncAuto();
      }
    }
  });
}

function executeFolderAction(itemId, actionType) {
  const item = history.find(h => h.id === itemId);
  if (!item) return;

  if (prefs.vib && navigator.vibrate) navigator.vibrate(20);

  if (actionType === 'archive') {
    item.done = true;
    item.later = false;
    
    const targetCat = cats.find(c => c.id === item.catId);
    if (targetCat && targetCat.webhook) {
      fetch(targetCat.webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: item.text ? `[${targetCat.label}] ${item.text}` : `[${targetCat.label}] (メモなし)`,
          category: targetCat.label,
          memo: item.text,
          timestamp: item.ts,
        }),
      }).catch(() => {});
    }
  } 
  else if (actionType === 'later') {
    item.done = false;
    item.later = true;
  } 
  else if (actionType === 'trash') {
    history = history.filter(h => h.id !== itemId);
  }

  localStorage.setItem('memo_history', JSON.stringify(history));
  renderCanvas();
  syncAuto();
}

// ── 「あとで」フォルダダブルタップ復元 ─────────────────────────────────────────
document.getElementById('folder-later').addEventListener('dblclick', () => { restoreLaterItems(); });
let lastTapTime = 0;
document.getElementById('folder-later').addEventListener('touchend', (e) => {
  const currentTime = new Date().getTime(); const tapLength = currentTime - lastTapTime;
  if (tapLength < 300 && tapLength > 0) { e.preventDefault(); restoreLaterItems(); }
  lastTapTime = currentTime;
});

function restoreLaterItems() {
  const laterCount = history.filter(h => h.later).length; if (laterCount === 0) return;
  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24; const cHeight = rect.height || 400;

  history.forEach(item => {
    if (item.later) {
      item.later = false; item.done = false;
      const pos = calculateInitialPosition(item.catId, cWidth, cHeight);
      item.x = pos.x; item.y = pos.y;
    }
  });
  localStorage.setItem('memo_history', JSON.stringify(history));
  if (prefs.vib && navigator.vibrate) navigator.vibrate(35);
  renderCanvas(); syncAuto();
}

// ── モーダル内カテゴリ選択 ＆ 1タップで即時作成 ───────────────────────────────────
function renderModalCatPickers() {
  modalCatPickers.innerHTML = '';
  cats.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'cat-chip';
    chip.style.borderLeft = `5px solid ${cat.color || '#7c3aed'}`;
    chip.innerHTML = `<span>${esc(cat.emoji)}</span><span>${esc(cat.label)}</span>`;
    
    // 【劇的進化】カテゴリをタップした瞬間に即座に付箋を貼る
    chip.addEventListener('click', () => {
      createStickyNote(cat.id);
    });
    modalCatPickers.appendChild(chip);
  });
}

function createStickyNote(catId) {
  const text = memoInput.value.trim();
  const targetCat = cats.find(c => c.id === catId) || cats[0];

  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24;
  const cHeight = rect.height || 400;
  const pos = calculateInitialPosition(targetCat?.id, cWidth, cHeight);

  const newItem = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    text: text,
    catId: targetCat?.id || 'unclassified',
    catLabel: targetCat?.label || '未分類',
    catEmoji: targetCat?.emoji || '📌',
    catBg: targetCat ? colorToBg(targetCat.color) : colorToBg('#7c3aed'),
    ts: new Date().toISOString(),
    done: false,
    later: false,
    x: pos.x,
    y: pos.y
  };

  history.unshift(newItem);
  if (history.length > 300) history.length = 300;
  localStorage.setItem('memo_history', JSON.stringify(history));

  inputModal.classList.remove('open');
  memoInput.blur();

  if (prefs.vib && navigator.vibrate) navigator.vibrate(15);
  renderCanvas();
  syncAuto();
}

function renderCatSettings() {
  catSettingsList.innerHTML = '';
  editCats.forEach((cat, i) => {
    const row = document.createElement('div'); row.className = 'cat-row';
    const swatchWrap = document.createElement('div'); swatchWrap.style.cssText = 'flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:3px;';
    const swatch = document.createElement('div'); swatch.className = 'cat-swatch'; swatch.style.background = colorToBg(cat.color || '#7c3aed'); swatch.textContent = cat.emoji;
    swatchWrap.append(swatch);

    const fields = document.createElement('div'); fields.className = 'cat-fields';
    fields.append(
      makeField('絵文字', 'text', cat.emoji, '📌', 4, v => { editCats[i].emoji = v; swatch.textContent = v || '?'; }),
      makeField('ラベル', 'text', cat.label, 'カテゴリ名', 12, v => { editCats[i].label = v; }),
      makeColorField(cat.color, v => { editCats[i].color = v; swatch.style.background = colorToBg(v); }),
      makeField('Webhook URL', 'url', cat.webhook, 'https://...', 300, v => { editCats[i].webhook = v; })
    );

    const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.textContent = '×';
    delBtn.addEventListener('click', () => { editCats.splice(i, 1); renderCatSettings(); });
    row.append(swatchWrap, fields, delBtn); catSettingsList.appendChild(row);
  });
}

function makeField(label, type, value, placeholder, maxLen, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'field-group';
  const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = label;
  const inp = document.createElement('input'); inp.type = type; inp.className = 'field-input'; inp.value = value || ''; inp.placeholder = placeholder; inp.maxLength = maxLen;
  inp.addEventListener('input', () => onChange(inp.value));
  wrap.append(lbl, inp); return wrap;
}

function makeColorField(color, onChange) {
  const DEFAULTS = ['#059669','#18181b','#7c3aed','#ea580c','#db2777','#0ea5e9','#d97706'];
  const safeColor = isValidHex(color) ? color : '#7c3aed';
  const wrap = document.createElement('div'); wrap.className = 'field-group';
  const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = 'ベースカラー';
  const row = document.createElement('div'); row.className = 'color-field';
  const picker = document.createElement('input'); picker.type = 'color'; picker.className = 'color-picker'; picker.value = safeColor;
  const text = document.createElement('input'); text.type = 'text'; text.className = 'field-input color-hex'; text.value = safeColor; text.maxLength = 7;
  picker.addEventListener('input', () => { text.value = picker.value; onChange(picker.value); });
  text.addEventListener('input', () => { let v = text.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (isValidHex(v)) { picker.value = v; onChange(v); } });
  const presets = document.createElement('div'); presets.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;';
  DEFAULTS.forEach(c => {
    const dot = document.createElement('button'); dot.type = 'button'; dot.style.cssText = `width:20px;height:20px;border-radius:50%;background:${c};border:none;cursor:pointer;`;
    dot.addEventListener('click', () => { picker.value = c; text.value = c; onChange(c); }); presets.appendChild(dot);
  });
  row.append(picker, text); wrap.append(lbl, row, presets); return wrap;
}

// ── Daily auto-add ─────────────────────────────────────────────────────────────
function renderDailyList() {
  const list = document.getElementById('daily-settings-list'); list.innerHTML = '';
  editDailyItems.forEach((item, i) => {
    const row = document.createElement('div'); row.className = 'daily-row';
    const sel = document.createElement('select'); sel.className = 'daily-cat-select';
    editCats.forEach(c => {
      const opt = document.createElement('option'); opt.value = c.id; opt.textContent = `${c.emoji} ${c.label}`;
      if (c.id === item.catId) opt.selected = true; sel.appendChild(opt);
    });
    sel.addEventListener('change', () => { editDailyItems[i].catId = sel.value; });
    const input = document.createElement('input'); input.type = 'text'; input.className = 'field-input'; input.style.flex = '1'; input.value = item.content || '';
    input.addEventListener('input', () => { editDailyItems[i].content = input.value; });
    const del = document.createElement('button'); del.className = 'daily-del-btn'; del.textContent = '×';
    del.addEventListener('click', () => { editDailyItems.splice(i, 1); renderDailyList(); });
    row.append(sel, input, del); list.appendChild(row);
  });
}

function checkDailyItems() {
  if (!dailyItems.length) return;
  const today = new Date().toDateString();
  if (history.some(h => new Date(h.ts).toDateString() === today && h.id.startsWith('daily-'))) return;
  
  const baseTs = Date.now(); let added = 0;
  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24; const cHeight = rect.height || 400;

  dailyItems.forEach((item, i) => {
    if (!item.content?.trim()) return;
    const targetCat = cats.find(c => c.id === item.catId) || cats[0];
    const pos = calculateInitialPosition(targetCat?.id, cWidth, cHeight);

    history.unshift({
      id: `daily-${baseTs}-${i}`, catId: targetCat?.id || 'unclassified', catLabel: targetCat?.label || '未分類', catEmoji: targetCat?.emoji || '📌',
      catBg: targetCat ? colorToBg(targetCat.color) : colorToBg('#7c3aed'), text: item.content.trim(),
      done: false, later: false, ts: new Date(baseTs + i).toISOString(), x: pos.x, y: pos.y
    });
    added++;
  });
  if (!added) return;
  localStorage.setItem('memo_history', JSON.stringify(history));
  renderCanvas(); syncAuto();
}

document.getElementById('add-daily-btn').addEventListener('click', () => { editDailyItems.push({ id: `d-${Date.now()}`, catId: editCats[0]?.id || '', content: '' }); renderDailyList(); });
vibToggle.addEventListener('click', () => { prefs.vib = !prefs.vib; vibToggle.classList.toggle('on', prefs.vib); });

document.getElementById('save-btn').addEventListener('click', () => {

// ── History Panel & チェックボックス連動アーカイブ化 ────────────────────────────
function openHistory() { renderHistory(); historyPanel.classList.add('open'); if (syncConfig.token && syncConfig.gistId && !syncDebounceTimer) { syncPull().then(ok => { if (ok) renderHistory(); }); } }
function closeHistory() { historyPanel.classList.remove('open'); renderCanvas(); }

function renderHistory() {
  historyFiltersEl.innerHTML = '';
  if (history.length) {
    const doneSection = document.createElement('div'); doneSection.className = 'filter-section'; doneSection.innerHTML = '<div class="filter-label">状態フィルター</div>';
    const doneRow = document.createElement('div'); doneRow.className = 'filter-row';
    [['all','全て'], ['canvas','キャンバス上'], ['archive','アーカイブ済み'], ['later','あとで保管中']].forEach(([val, label]) => {
      const pill = document.createElement('button'); pill.className = 'filter-pill' + (historyFilter.done === val ? ' active' : ''); pill.textContent = label;
      pill.addEventListener('click', () => { historyFilter.done = val; renderHistory(); });
      doneRow.appendChild(pill);
    });
    doneSection.appendChild(doneRow); historyFiltersEl.appendChild(doneSection);
  }

  if (!history.length) { historyList.innerHTML = '<div class="h-empty">履歴がありません</div>'; return; }

  let filtered = history;
  if (historyFilter.done === 'canvas')  filtered = filtered.filter(h => !h.done && !h.later);
  if (historyFilter.done === 'archive') filtered = filtered.filter(h => h.done);
  if (historyFilter.done === 'later')   filtered = filtered.filter(h => h.later);

  let html = ''; let lastDate = '';
  filtered.forEach(item => {
    const d = new Date(item.ts);
    const dateStr = d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
    if (dateStr !== lastDate) { html += `<div class="date-sep">${esc(dateStr)}</div>`; lastDate = dateStr; }
    
    const isDone = item.done;
    const stateBadge = item.later ? '⏳ あとで' : (isDone ? '✓ アーカイブ済' : '○ キャンバス');

    html += `
      <div class="h-item ${isDone ? 'done' : ''}">
        <div class="h-check ${isDone ? 'checked' : ''}" data-id="${esc(item.id)}">✓</div>
        <div class="h-badge" style="background:${esc(item.catBg || '#7c3aed')}">${esc(item.catEmoji || '📌')}</div>
        <div class="h-body">
          <div class="h-text">${esc(item.text || '(空メモ)')}</div>
          <div class="h-meta">${esc(item.catLabel || '未分類')} · ${esc(stateBadge)}</div>
        </div>
        <div class="h-action-btns">
          <button class="h-btn-small h-restore" data-id="${esc(item.id)}" title="キャンバスに戻す">↩️</button>
          ${item.text ? `<button class="h-btn-small h-copy" data-id="${esc(item.id)}">📋</button>` : ''}
          <button class="h-btn-small h-del" data-id="${esc(item.id)}">🗑️</button>
        </div>
      </div>`;
  });
  historyList.innerHTML = html;

  // 履歴での丸型チェックボックスのクリックイベント（即時アーカイブ化）
  historyList.querySelectorAll('.h-check').forEach(chk => {
    chk.addEventListener('click', () => {
      const found = history.find(h => h.id === chk.dataset.id);
      if (found) {
        // 現在の状態を反転
        found.done = !found.done;
        if (found.done) {
          found.later = false; // アーカイブへ行くので「あとで」フラグは折る
        } else {
          found.catId = found.catId || 'unclassified';
        }
        localStorage.setItem('memo_history', JSON.stringify(history));
        if (prefs.vib && navigator.vibrate) navigator.vibrate(15);
        renderHistory();
        syncAuto();
      }
    });
  });

  // キャンバスへ明示的に復元するロジック
  historyList.querySelectorAll('.h-restore').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = history.find(h => h.id === btn.dataset.id);
      if (found) {
        found.done = false; found.later = false;
        const rect = canvasContainer.getBoundingClientRect();
        const pos = calculateInitialPosition(found.catId, rect.width || 300, rect.height || 400);
        found.x = pos.x; found.y = pos.y;
        localStorage.setItem('memo_history', JSON.stringify(history));
        renderHistory(); syncAuto();
      }
    });
  });

  historyList.querySelectorAll('.h-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = history.find(h => h.id === btn.dataset.id);
      if (found?.text) { navigator.clipboard.writeText(found.text).then(() => { btn.textContent = '✓'; setTimeout(() => btn.textContent = '📋', 1200); }); }
    });
  });

  historyList.querySelectorAll('.h-del').forEach(btn => {
    btn.addEventListener('click', () => {
      history = history.filter(h => h.id !== btn.dataset.id);
      localStorage.setItem('memo_history', JSON.stringify(history));
      renderHistory(); syncAuto();
    });
  });
}

document.getElementById('history-btn').addEventListener('click', openHistory);
document.getElementById('history-back').addEventListener('click', closeHistory);

document.getElementById('export-btn').addEventListener('click', () => {
  const done = history.filter(h => h.done); if (!done.length) { alert('アーカイブ済みのアイテムがありません'); return; }
  const rows = [['日時', 'カテゴリ', '内容']];
  done.forEach(h => { rows.push([new Date(h.ts).toLocaleString('ja-JP'), h.catLabel || '', `"${(h.text || '').replace(/"/g, '""')}"`]); });
  const csv = '﻿' + rows.map(r => r.join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `memo-archive-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(url);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  const doneCount = history.filter(h => h.done).length; if (!doneCount) { alert('削除対象のアーカイブがありません'); return; }
  if (confirm(`アーカイブ済み ${doneCount} 件を履歴から完全に消去しますか？`)) {
    history = history.filter(h => !h.done); localStorage.setItem('memo_history', JSON.stringify(history)); renderHistory(); syncAuto();
  }
});

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── PWA ──────────────────────────────────────────────────────────────────────
function setupPWA() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#ec4899'); ctx.fillStyle = g;
  const r = 80; ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(512 - r, 0); ctx.quadraticCurveTo(512, 0, 512, r); ctx.lineTo(512, 512 - r); ctx.quadraticCurveTo(512, 512, 512 - r, 512); ctx.lineTo(r, 512); ctx.quadraticCurveTo(0, 512, 0, 512 - r); ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.fill();
  ctx.font = '280px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚡', 256, 260);
  const iconURL = c.toDataURL('image/png'); document.getElementById('apple-icon').href = iconURL;
  const manifest = { name: 'スワイプ超特急メモ', short_name: '超特急メモ', start_url: './', display: 'standalone', background_color: '#f3f0ff', theme_color: '#7c3aed', orientation: 'portrait-primary', lang: 'ja', icons: [{ src: iconURL, sizes: '512x512', type: 'image/png' }] };
  document.getElementById('pwa-manifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
}

// ── GitHub Gist Sync ──────────────────────────────────────────────────────────
let syncConfig = JSON.parse(localStorage.getItem('memo_sync') || '{}');
let syncDebounceTimer = null;

function setSyncStatus(msg) { const el = document.getElementById('sync-status'); if (el) el.textContent = msg; }
async function gistReq(method, path, body) {
  const res = await fetch(`https://api.github.com${path}`, { method, headers: { 'Authorization': `token ${syncConfig.token}`, 'Accept': 'application/vnd.github.v3+json', ...(body ? { 'Content-Type': 'application/json' } : {}) }, ...(body ? { body: JSON.stringify(body) } : {}) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json();
}
function buildSyncPayload() { return JSON.stringify({ cats, history, prefs, dailyItems, dailyItemsSavedAt: localStorage.getItem('memo_daily_saved')||'', savedAt: new Date().toISOString() }, null, 2); }

async function syncPush() {
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl?.value.trim()) syncConfig.token = tokenEl.value.trim(); if (!syncConfig.token) { setSyncStatus('⚠ 未設定'); return; }
  setSyncStatus('送信中…');
  try {
    const content = buildSyncPayload();
    if (syncConfig.gistId) { await gistReq('PATCH', `/gists/${syncConfig.gistId}`, { files: { 'memo-sync.json': { content } } }); }
    else {
      const res = await gistReq('POST', '/gists', { description: '超特急メモ同期データ', public: false, files: { 'memo-sync.json': { content } } });
      syncConfig.gistId = res.id;
    }
    syncConfig.lastSync = new Date().toISOString(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig));
    if (gistEl && syncConfig.gistId) gistEl.value = syncConfig.gistId;
    setSyncStatus(`✓ 送信完了 ${new Date().toLocaleTimeString('ja-JP')}`);
  } catch (e) { setSyncStatus(`⚠ エラー: ${e.message}`); }
}

async function syncPull() {
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl?.value.trim()) syncConfig.token = tokenEl.value.trim(); if (gistEl?.value.trim()) syncConfig.gistId = gistEl.value.trim();
  if (!syncConfig.token || !syncConfig.gistId) { setSyncStatus('⚠ 未入力あり'); return false; }
  setSyncStatus('取得中…');
  try {
    const gist = await gistReq('GET', `/gists/${syncConfig.gistId}`);
    const raw = gist.files?.['memo-sync.json']?.content; if (!raw) throw new Error('データ空');
    const data = JSON.parse(raw);
    if (data.cats) { cats = data.cats; localStorage.setItem('memo_cats', JSON.stringify(cats)); }
    if (data.history) { history = data.history; localStorage.setItem('memo_history', JSON.stringify(history)); }
    if (data.prefs) { prefs = data.prefs; localStorage.setItem('memo_prefs', JSON.stringify(prefs)); }
    if (data.dailyItems) { dailyItems = data.dailyItems; localStorage.setItem('memo_daily', JSON.stringify(dailyItems)); }
    syncConfig.lastSync = new Date().toISOString(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig));
    setSyncStatus(`✓ 同期完了 ${new Date().toLocaleTimeString('ja-JP')}`); renderCanvas(); return true;
  } catch (e) { setSyncStatus(`⚠ エラー: ${e.message}`); return false; }
}

function syncAuto() { if (!syncConfig.token) return; clearTimeout(syncDebounceTimer); syncDebounceTimer = setTimeout(() => { syncDebounceTimer = null; syncPush(); }, 3000); }

const _origOpenSettings = openSettings;
openSettings = function() {
  _origOpenSettings();
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl && syncConfig.token) tokenEl.value = syncConfig.token; if (gistEl && syncConfig.gistId) gistEl.value = syncConfig.gistId;
  if (syncConfig.lastSync) setSyncStatus(`最終同期: ${new Date(syncConfig.lastSync).toLocaleTimeString('ja-JP')}`);
};

document.getElementById('sync-token').addEventListener('input', e => { syncConfig.token = e.target.value.trim(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); });
document.getElementById('sync-gist-id').addEventListener('input', e => { syncConfig.gistId = e.target.value.trim(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); });
document.getElementById('sync-push-btn').addEventListener('click', syncPush);
document.getElementById('sync-pull-btn').addEventListener('click', async () => { const ok = await syncPull(); if (ok) renderHistory(); });
document.getElementById('sync-reset-btn').addEventListener('click', () => { if (!confirm('Gist IDをリセットしますか？')) return; syncConfig.gistId = ''; localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); document.getElementById('sync-gist-id').value = ''; setSyncStatus('リセット完了'); });
document.getElementById('copy-gist-btn').addEventListener('click', () => { const id = document.getElementById('sync-gist-id').value; if (!id) return; navigator.clipboard.writeText(id).then(() => { const b = document.getElementById('copy-gist-btn'); b.textContent = '✓'; setTimeout(() => b.textContent = '📋', 1500); }); });

// ── Init ─────────────────────────────────────────────────────────────────────
const buildStamp = new Date(document.lastModified).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
document.getElementById('build-stamp').textContent = `build: ${buildStamp}`;

setupPWA(); renderCanvas();
if (syncConfig.token && syncConfig.gistId) { syncPull().then(ok => { checkDailyItems(); }); } else { checkDailyItems(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && syncConfig.token && syncConfig.gistId) { syncPull(); } });
</script>
