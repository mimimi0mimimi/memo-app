<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>はるメモ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="はるメモ">
  <meta name="theme-color" content="#f3f0ff">
  <link id="pwa-manifest" rel="manifest">
  <link id="apple-icon" rel="apple-touch-icon">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f3f0ff;
      color: #1a1a2e;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 5% 5%,   rgba(167,139,250,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 95% 95%,  rgba(251,191,36,0.22)  0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 80% 15%,  rgba(244,114,182,0.18) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Main Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding-top: max(env(safe-area-inset-top, 0px), 10px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 10px);
      padding-left: 12px;
      padding-right: 12px;
      gap: 8px;
      position: relative;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    #header-title {
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      background: #fff;
      border: none;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c3aed;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(124,58,237,0.15);
    }
    .icon-btn:active { background: #ede9fe; transform: scale(0.95); }
    
    #add-trigger-btn {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }

    /* ── Canvas Area ── */
    #canvas-container {
      flex: 1;
      position: relative;
      background: rgba(255, 255, 255, 0.4);
      border: 2px dashed #e8e0ff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(124,58,237,0.05);
    }

    /* ── Sticky Note (付箋) ── */
    .sticky-note {
      position: absolute;
      width: 140px;
      min-height: 110px;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 6px 16px rgba(124,58,237,0.12);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 6px solid #a78bfa;
      transition: transform 0.05s linear, box-shadow 0.1s, opacity 0.2s;
      z-index: 5;
      user-select: none;
      -webkit-user-select: none;
    }
    .sticky-note.dimmed {
      opacity: 0.12 !important;
      pointer-events: none;
      z-index: 0 !important;
    }
    .sticky-note.dragging {
      cursor: grabbing;
      box-shadow: 0 14px 28px rgba(124,58,237,0.25);
      z-index: 99;
    }
    .sticky-note.starred {
      z-index: 20;
      box-shadow: 0 6px 20px rgba(251,191,36,0.35);
    }
    .sticky-note-star {
      position: absolute;
      top: 6px; right: 7px;
      font-size: 13px;
      line-height: 1;
      pointer-events: none;
    }
    .sticky-note-text {
      font-size: 13px;
      line-height: 1.4;
      color: #1a1a2e;
      word-break: break-all;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      user-select: none;
    }
    .sticky-note-meta {
      font-size: 9px;
      color: #a78bfa;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    /* ── サブタグ ── */
    .sticky-tag {
      position: absolute;
      top: -7px; right: 14px;
      width: 14px; height: 23px;
      border-radius: 0 0 6px 6px;
      box-shadow: 1px 2px 5px rgba(0,0,0,0.13);
      z-index: 6; pointer-events: none;
    }

    /* 編集モード内タグピッカー */
    #detail-edit-tag-label {
      font-size: 10px; font-weight: 700; color: #a78bfa;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 10px 0 6px; display: none;
    }
    #detail-edit-tag-pickers {
      display: none; flex-wrap: wrap; gap: 7px; margin-bottom: 12px;
    }
    .tag-chip {
      width: 28px; height: 28px; border-radius: 6px;
      border: 3px solid transparent; cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .tag-chip:active { transform: scale(0.88); }
    .tag-chip.selected { border-color: #7c3aed; transform: scale(1.15); }
    .tag-chip-none {
      width: 28px; height: 28px; border-radius: 6px;
      border: 2px dashed #c4b5fd; background: transparent;
      cursor: pointer; touch-action: manipulation;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
      color: #c4b5fd; transition: transform 0.15s;
    }
    .tag-chip-none:active { transform: scale(0.88); }
    .tag-chip-none.selected { border-color: #7c3aed; color: #7c3aed; }
    .sticky-note-meta-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── 3大特殊フォルダ (吸い込み領域) ── */
    #folder-area {
      display: flex;
      gap: 10px;
      padding: 6px 2px;
      flex-shrink: 0;
      z-index: 10;
    }

    .folder-box {
      flex: 1;
      height: 76px;
      background: #fff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
      border: 2px solid transparent;
      position: relative;
    }
    #folder-archive { border-bottom: 4px solid #6bc4a6; }
    #folder-later { border-bottom: 4px solid #9b8fe0; transition: background-color 0.3s, border-color 0.15s; }
    #folder-trash { border-bottom: 4px solid #c47faa; }
    
    #folder-archive.drag-over { background-color: #eaf7f3; border-color: #6bc4a6; transform: scale(1.06); }
    #folder-later.drag-over { background-color: #f0eeff !important; border-color: #9b8fe0; transform: scale(1.06); }
    #folder-trash.drag-over { background-color: #f9eef4; border-color: #c47faa; transform: scale(1.06); }

    /* 「あとで」フォルダに付箋が入っているときの見た目用CSS */
    #folder-later.has-items {
      background-color: #e3f2fd; /* 薄い水色 */
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
    }

    .folder-emoji { font-size: 24px; }
    .folder-label { font-size: 11px; font-weight: 800; color: #4c4c6d; text-align: center; }
    .folder-hint { font-size: 8px; color: #a78bfa; font-weight: normal; margin-top: -2px; }

    /* ── Detail Modal ── */
    #detail-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0);
      z-index: 1000;
      pointer-events: none;
      transition: background 0.25s ease;
    }
    #detail-modal.open {
      background: rgba(26, 26, 46, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: all;
    }

    #detail-card {
      position: fixed;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 16px rgba(124,58,237,0.12);
      border-left: 6px solid #a78bfa;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform-origin: top left;
      transform: scale(1);
      opacity: 0;
      pointer-events: none;
      transition: none;
    }
    #detail-modal.open #detail-card {
      opacity: 1;
      pointer-events: all;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1),
                  opacity 0.2s ease,
                  border-radius 0.3s ease,
                  left 0.3s cubic-bezier(0.2, 0.8, 0.3, 1),
                  top 0.3s cubic-bezier(0.2, 0.8, 0.3, 1),
                  width 0.3s cubic-bezier(0.2, 0.8, 0.3, 1),
                  max-height 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    #detail-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    #detail-cat-badge {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      flex-shrink: 0;
    }
    #detail-cat-label {
      font-size: 13px; font-weight: 700; color: #7c3aed; flex: 1;
    }
    #detail-ts {
      font-size: 11px; color: #a78bfa;
    }
    #detail-text-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 60px;
      margin-bottom: 12px;
    }
    #detail-text-display {
      font-size: 15px; line-height: 1.6; color: #1a1a2e;
      word-break: break-word; white-space: pre-wrap;
      user-select: text;
    }
    #detail-edit-input {
      width: 100%; min-height: 100px;
      font-size: 15px; line-height: 1.6; color: #1a1a2e;
      font-family: inherit; background: #f8f5ff;
      border: 2px solid #e8e0ff; border-radius: 10px;
      padding: 10px; outline: none; resize: none;
      user-select: text; -webkit-appearance: none;
      display: none;
    }
    #detail-edit-input:focus { border-color: #a78bfa; }
    #detail-edit-cat-label {
      font-size: 10px; font-weight: 700; color: #a78bfa;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 10px 0 6px; display: none;
    }
    #detail-edit-cat-pickers {
      display: none; grid-template-columns: 1fr 1fr; gap: 6px;
      max-height: 130px; overflow-y: auto; margin-bottom: 12px;
    }
    #detail-actions {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    #detail-close-btn {
      flex: 1; padding: 11px; background: #ede9fe; border: none;
      border-radius: 12px; color: #7c3aed; font-size: 14px;
      font-weight: 700; cursor: pointer; touch-action: manipulation;
    }
    #detail-edit-btn {
      background: none; border: none; padding: 4px 2px;
      color: #a78bfa; font-size: 13px; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      text-decoration: underline; text-underline-offset: 3px;
      white-space: nowrap;
    }
    #detail-copy-btn {
      background: none; border: none; padding: 4px 2px;
      color: #a78bfa; font-size: 13px; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      text-decoration: underline; text-underline-offset: 3px;
      white-space: nowrap;
    }
    #detail-save-btn {
      flex: 1; padding: 11px; background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border: none; border-radius: 12px; color: #fff; font-size: 14px;
      font-weight: 700; cursor: pointer; touch-action: manipulation;
      display: none;
    }

    /* ── Trash Modal ── */
    #trash-modal {
      position: fixed; inset: 0;
      background: rgba(26,26,46,0);
      z-index: 1000; pointer-events: none;
      transition: background 0.25s ease;
    }
    #trash-modal.open {
      background: rgba(26,26,46,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: all;
    }
    #trash-card {
      position: fixed;
      background: #fff;
      border-radius: 18px; padding: 16px;
      box-shadow: 0 6px 20px rgba(196,127,170,0.18);
      border-bottom: 4px solid #c47faa;
      display: flex; flex-direction: column;
      overflow: hidden; opacity: 0; pointer-events: none;
      transition: none;
    }
    #trash-modal.open #trash-card {
      opacity: 1; pointer-events: all;
      transition: left 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  top 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  width 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  max-height 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  border-radius 0.3s ease, opacity 0.2s ease;
    }
    #trash-card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-shrink: 0;
    }
    #trash-card-title { font-size: 15px; font-weight: 800; color: #1a1a2e; flex: 1; }
    #trash-empty-btn {
      padding: 6px 10px; background: #fce7f3; border: none;
      border-radius: 8px; color: #c47faa; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    #trash-card-close {
      width: 30px; height: 30px; background: #fce7f3; border: none;
      border-radius: 50%; font-size: 16px; color: #c47faa;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; touch-action: manipulation;
    }
    #trash-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 8px;
    }
    .trash-item {
      background: #fdf4f9; border-radius: 12px;
      padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    }
    .trash-item-badge {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .trash-item-body { flex: 1; min-width: 0; }
    .trash-item-text {
      font-size: 13px; color: #1a1a2e; line-height: 1.4;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .trash-item-expires { font-size: 10px; color: #c47faa; margin-top: 2px; font-weight: 600; }
    .trash-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .trash-restore-btn {
      padding: 6px 10px; background: #9b8fe0; border: none;
      border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    .trash-archive-btn {
      padding: 6px 10px; background: #e8f5e9; border: none;
      border-radius: 8px; color: #6bc4a6; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    .trash-delete-btn {
      padding: 6px 8px; background: #fce7f3; border: none;
      border-radius: 8px; color: #c47faa; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
    }
    #trash-empty-state {
      text-align: center; color: #e9a8cc; font-size: 14px;
      padding: 24px 0; line-height: 1.8;
    }
    .trash-retention-row {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
    }
    .trash-retention-btn {
      flex: 1; padding: 8px; background: #fff; border: 2px solid #e8e0ff;
      border-radius: 10px; font-size: 13px; font-weight: 700; color: #7c6aad;
      cursor: pointer; touch-action: manipulation; font-family: inherit;
    }
    .trash-retention-btn.active {
      background: #c47faa; border-color: #c47faa; color: #fff;
    }


    #later-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0);
      z-index: 1000;
      pointer-events: none;
      transition: background 0.25s ease;
    }
    #later-modal.open {
      background: rgba(26, 26, 46, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: all;
    }
    #later-card {
      position: fixed;
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(59,130,246,0.18);
      border-bottom: 4px solid #9b8fe0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: none;
    }
    #later-modal.open #later-card {
      opacity: 1;
      pointer-events: all;
      transition: left 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  top 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  width 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  max-height 0.3s cubic-bezier(0.2,0.8,0.3,1),
                  border-radius 0.3s ease,
                  opacity 0.2s ease;
    }
    #later-card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-shrink: 0;
    }
    #later-card-title {
      font-size: 15px; font-weight: 800; color: #1a1a2e; flex: 1;
    }
    #later-restore-all-btn {
      padding: 6px 10px; background: #e0eeff; border: none;
      border-radius: 8px; color: #9b8fe0; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    #later-card-close {
      width: 30px; height: 30px; background: #e0eeff; border: none;
      border-radius: 50%; font-size: 16px; color: #9b8fe0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; touch-action: manipulation;
    }
    #later-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 8px;
    }
    .later-item {
      background: #f0f7ff; border-radius: 12px;
      padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    }
    .later-item-badge {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .later-item-text {
      flex: 1; font-size: 13px; color: #1a1a2e; line-height: 1.4;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .later-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .later-now-btn {
      padding: 6px 10px; background: #9b8fe0; border: none;
      border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    .later-archive-btn {
      padding: 6px 10px; background: #e8f5e9; border: none;
      border-radius: 8px; color: #6bc4a6; font-size: 12px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    #later-empty {
      text-align: center; color: #93c5fd; font-size: 14px;
      padding: 24px 0; line-height: 1.8;
    }

    /* ── Import Choice Modal ── */
    #import-choice-modal {
      position: fixed; inset: 0;
      background: rgba(26,26,46,0);
      z-index: 3000; pointer-events: none;
      display: none;
      align-items: center; justify-content: center;
      transition: background 0.2s ease;
    }
    #import-choice-modal.open {
      display: flex;
      background: rgba(26,26,46,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: all;
    }
    #import-choice-card {
      background: #f8f5ff; border-radius: 22px;
      padding: 22px 20px 16px; width: calc(100% - 48px); max-width: 320px;
      box-shadow: 0 8px 32px rgba(124,58,237,0.18);
      transform: scale(0.9); opacity: 0;
      transition: transform 0.25s cubic-bezier(0.2,0.8,0.3,1), opacity 0.2s ease;
    }
    #import-choice-modal.open #import-choice-card { transform: scale(1); opacity: 1; }
    #import-choice-title {
      font-size: 15px; font-weight: 900; color: #1a1a2e;
      margin-bottom: 6px;
    }
    #import-choice-desc {
      font-size: 13px; color: #7c6aad; line-height: 1.6; margin-bottom: 18px;
    }
    .import-choice-btn {
      width: 100%; padding: 13px; border: none; border-radius: 14px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      touch-action: manipulation; margin-bottom: 8px; font-family: inherit;
      text-align: left;
    }
    .import-choice-btn.overwrite {
      background: #ede9fe; color: #5b21b6;
    }
    .import-choice-btn.append {
      background: #f0fdf4; color: #15803d;
    }
    .import-choice-btn.cancel {
      background: #f3f4f6; color: #6b7280;
      margin-bottom: 0;
    }

    /* ── Input Modal ── */
    #input-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;

<script>
'use strict';

// ── Color helpers ─────────────────────────────────────────────────────────────
function darkenColor(hex, factor = 0.72) {
  const h = hex.replace('#', '');
  const r = Math.round(parseInt(h.slice(0,2), 16) * factor);
  const g = Math.round(parseInt(h.slice(2,4), 16) * factor);
  const b = Math.round(parseInt(h.slice(4,6), 16) * factor);
  return '#' + [r,g,b].map(v => Math.min(255,v).toString(16).padStart(2,'0')).join('');
}
function lightenColor(hex, mix = 0.12) {
  const h = hex.replace('#', '');
  const r = Math.round(parseInt(h.slice(0,2), 16) * mix + 255 * (1 - mix));
  const g = Math.round(parseInt(h.slice(2,4), 16) * mix + 255 * (1 - mix));
  const b = Math.round(parseInt(h.slice(4,6), 16) * mix + 255 * (1 - mix));
  return '#' + [r,g,b].map(v => Math.min(255,v).toString(16).padStart(2,'0')).join('');
}
function colorToBg(hex) { return `linear-gradient(135deg, ${hex}, ${darkenColor(hex)})`; }
function extractColor(bg) { const m = (bg || '').match(/#[0-9a-fA-F]{6}/); return m ? m[0] : '#7c3aed'; }
function isValidHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }

// ── キャンバスカテゴリフィルター ─────────────────────────────────────────────
let canvasFilterCatIds = new Set();

function renderCanvasFilterBar() {
  const bar = document.getElementById('canvas-filter-bar');
  bar.innerHTML = '';
  cats.forEach(cat => {
    const active = canvasFilterCatIds.has(cat.id);
    const pill = document.createElement('button');
    pill.className = 'canvas-filter-pill' + (active ? ' active' : '');
    pill.textContent = `${cat.emoji} ${cat.label}`;
    if (active) {
      pill.style.background = cat.color;
      pill.style.borderColor = cat.color;
      pill.style.color = '#fff';
      pill.style.borderLeft = '';
    } else {
      pill.style.background = '#fff';
      pill.style.borderColor = '#e8e0ff';
      pill.style.color = '';
      pill.style.borderLeft = `4px solid ${cat.color}`;
    }
    pill.addEventListener('click', () => {
      if (canvasFilterCatIds.has(cat.id)) {
        canvasFilterCatIds.delete(cat.id);
      } else {
        canvasFilterCatIds.add(cat.id);
      }
      applyCanvasFilter();
    });
    bar.appendChild(pill);
  });
}

function applyCanvasFilter() {
  renderCanvas();
}

// ── Render Canvas & 更新フォルダ状態 ──────────────────────────────────────────
function renderCanvas() {
  canvasContainer.innerHTML = '';
  const activeNotes = history.filter(item => !item.done && !item.later && !item.deleted);

  // 【機能追加】「あとで」フォルダの見た目を動的に変化させるロジック
  const laterCount = history.filter(item => item.later).length;
  const folderLaterEl = document.getElementById('folder-later');
  const laterEmojiEl = document.getElementById('later-emoji');
  const laterLabelEl = document.getElementById('later-label');
  
  if (laterCount > 0) {
    folderLaterEl.classList.add('has-items');
    laterEmojiEl.textContent = '⏳';
    laterLabelEl.textContent = `あとで (${laterCount})`; // 件数をリアルタイム表示
  } else {
    folderLaterEl.classList.remove('has-items');
    laterEmojiEl.textContent = '⏳';
    laterLabelEl.textContent = 'あとで';
  }

  if (activeNotes.length === 0) {
    const hint = document.createElement('div');
    hint.style.cssText = 'position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#c4b5fd; font-size:13px; font-weight:600; text-align:center; padding:20px; pointer-events:none; line-height:1.6;';
    hint.innerHTML = 'キャンバスはピカピカです！<br>右上「＋」ボタンから新しいメモを追加、<br>または「あとで」フォルダから復元。';
    canvasContainer.appendChild(hint);
    return;
  }

  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24;
  const cHeight = rect.height || 400;

  activeNotes.forEach(item => {
    if (item.x === undefined || item.y === undefined) {
      const pos = calculateInitialPosition(item.catId, cWidth, cHeight);
      item.x = pos.x; item.y = pos.y;
    }

    // 旧データ（絶対値）の互換変換：1より大きければ絶対値と判断
    if (item.x > 1 || item.y > 1) {
      item.x = item.x / cWidth;
      item.y = item.y / cHeight;
    }

    const absX = Math.min(Math.max(0, item.x * cWidth),  cWidth  - 140);
    const absY = Math.min(Math.max(0, item.y * cHeight), cHeight - 110);

    const note = document.createElement('div');
    note.className = 'sticky-note';
    note.dataset.id = item.id;
    note.style.left = `${absX}px`;
    note.style.top  = `${absY}px`;
    
    const catData = cats.find(c => c.id === item.catId);
    if (catData && catData.color) {
      note.style.borderLeftColor = catData.color;
      note.style.background = lightenColor(catData.color, 0.12);
    }

    // 【機能追加】時間表示に「月日」を追加
    const dateObj = new Date(item.ts);
    const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
    const timeStr = dateObj.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

    note.innerHTML = `
      ${item.tagColor ? `<div class="sticky-tag" style="background:${item.tagColor}"></div>` : ''}
      ${item.starred ? '<div class="sticky-note-star">⭐</div>' : ''}
      <div class="sticky-note-text">${esc(item.text || '(空メモ)')}</div>
      <div class="sticky-note-meta">
        <div>${esc(catData?.emoji || '📌')} ${esc(item.catLabel || '未分類')}</div>
        <div class="sticky-note-meta-row">
          <span>📅 ${esc(dateStr)}</span>
          <span>${esc(timeStr)}</span>
        </div>
      </div>
    `;
    if (item.starred) note.classList.add('starred');
    if (canvasFilterCatIds.size > 0 && !canvasFilterCatIds.has(item.catId)) note.classList.add('dimmed');

    // ベロをタップで色循環
    const tagEl = note.querySelector('.sticky-tag');
    if (tagEl) {
      tagEl.style.pointerEvents = 'auto';
      tagEl.style.cursor = 'pointer';
      tagEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
      tagEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const found = history.find(h => h.id === item.id);
        if (!found) return;
        const colors = SUB_TAG_COLORS.map(t => t.color);
        const cur = colors.indexOf(found.tagColor);
        found.tagColor = colors[(cur + 1) % colors.length];
        localStorage.setItem('memo_history', JSON.stringify(history));
        syncAuto();
        tagEl.style.background = found.tagColor;
      });
    }

    setupDragElement(note, item);
    canvasContainer.appendChild(note);
  });

  renderCanvasFilterBar();
}

function calculateInitialPosition(catId, canvasWidth, canvasHeight) {
  const catIndex = cats.findIndex(c => c.id === catId);
  const totalCats = cats.length || 1;
  const safeIndex = catIndex >= 0 ? catIndex : 0;

  const laneWidth = (canvasWidth - 150) / totalCats;
  const absX = Math.floor(10 + (safeIndex * laneWidth) + (Math.random() * (laneWidth * 0.4)));
  const absY = Math.max(15, Math.floor(20 + Math.random() * (canvasHeight - 150)));

  return { x: absX / canvasWidth, y: absY / canvasHeight };
}

// ── ポインターイベント対応ドラッグロジック ────────────────────────────────────
function setupDragElement(el, item) {
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;
  let targetsData = [];
  let isDragging = false;
  let longPressTimer = null;
  let longPressFired = false;

  el.addEventListener('pointerdown', (e) => {
    isDragging = true;
    longPressFired = false;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);

    startX = e.clientX;
    startY = e.clientY;
    initialLeft = parseInt(el.style.left, 10) || 0;
    initialTop = parseInt(el.style.top, 10) || 0;

    targetsData = [
      { element: document.getElementById('folder-archive'), id: 'archive', rect: document.getElementById('folder-archive').getBoundingClientRect() },
      { element: document.getElementById('folder-later'),   id: 'later',   rect: document.getElementById('folder-later').getBoundingClientRect() },
      { element: document.getElementById('folder-trash'),   id: 'trash',   rect: document.getElementById('folder-trash').getBoundingClientRect() }
    ];

    longPressTimer = setTimeout(() => {
      const dx = Math.abs(parseInt(el.style.left, 10) - initialLeft);
      const dy = Math.abs(parseInt(el.style.top,  10) - initialTop);
      if (dx < 5 && dy < 5) {
        longPressFired = true;
        const found = history.find(h => h.id === item.id);
        if (found) {
          found.starred = !found.starred;
          localStorage.setItem('memo_history', JSON.stringify(history));
         
          renderCanvas();
          syncAuto();
        }
      }
    }, 500);

   
  });

  el.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      clearTimeout(longPressTimer);
    }

    let newLeft = initialLeft + dx;
    let newTop = initialTop + dy;

    const cRect = canvasContainer.getBoundingClientRect();
    if (newLeft < 0) newLeft = 0;
    if (newLeft > cRect.width - 140) newLeft = cRect.width - 140;
    if (newTop < 0) newTop = 0;
    if (newTop > cRect.height - 110) newTop = cRect.height - 110;

    el.style.left = `${newLeft}px`;
    el.style.top = `${newTop}px`;

    const currentX = e.clientX;
    const currentY = e.clientY;
    
    targetsData.forEach(tgt => {
      if (currentX >= tgt.rect.left && currentX <= tgt.rect.right &&
          currentY >= tgt.rect.top && currentY <= tgt.rect.bottom) {
        tgt.element.classList.add('drag-over');
      } else {
        tgt.element.classList.remove('drag-over');
      }
    });
  });

  el.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    clearTimeout(longPressTimer);
    isDragging = false;
    el.classList.remove('dragging');
    el.releasePointerCapture(e.pointerId);

    if (longPressFired) return;

    const dx = Math.abs(e.clientX - startX);
    const dy = Math.abs(e.clientY - startY);
    const isTap = dx < 6 && dy < 6;
    
    let matchedTarget = null;
    targetsData.forEach(tgt => {
      if (tgt.element.classList.contains('drag-over')) {
        matchedTarget = tgt;
        tgt.element.classList.remove('drag-over');
      }
    });

    if (matchedTarget) {
      executeFolderAction(item.id, matchedTarget.id);
    } else if (isTap) {
      openDetailModal(item.id);
    } else {
      const found = history.find(h => h.id === item.id);
      if (found) {
        const cRect = canvasContainer.getBoundingClientRect();
        found.x = parseInt(el.style.left, 10) / (cRect.width || 1);
        found.y = parseInt(el.style.top, 10) / (cRect.height || 1);
        localStorage.setItem('memo_history', JSON.stringify(history));
        syncAuto();
      }
    }
  });

  el.addEventListener('pointercancel', () => {
    if (!isDragging) return;
    clearTimeout(longPressTimer);
    isDragging = false;
    el.classList.remove('dragging');
    const found = history.find(h => h.id === item.id);
    if (found) {
      const cRect = canvasContainer.getBoundingClientRect();
      found.x = parseInt(el.style.left, 10) / (cRect.width || 1);
      found.y = parseInt(el.style.top, 10) / (cRect.height || 1);
      localStorage.setItem('memo_history', JSON.stringify(history));
    }
    renderCanvas();
  });
}

function executeFolderAction(itemId, actionType) {
  const item = history.find(h => h.id === itemId);
  if (!item) return;

 

  if (actionType === 'archive') {
    item.done = true;
    item.later = false;
    
    const targetCat = cats.find(c => c.id === item.catId);
    if (targetCat && targetCat.webhook) {
      fetch(targetCat.webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: item.text ? `[${targetCat.label}] ${item.text}` : `[${targetCat.label}] (メモなし)`,
          category: targetCat.label,
          memo: item.text,
          timestamp: item.ts,
        }),
      }).catch(() => {});
    }
  } 
  else if (actionType === 'later') {
    item.done = false;
    item.later = true;
  } 
  else if (actionType === 'trash') {
    const item = history.find(h => h.id === itemId);
    if (item) { item.deleted = true; item.deletedAt = new Date().toISOString(); item.done = false; item.later = false; }
  }

  localStorage.setItem('memo_history', JSON.stringify(history));
  renderCanvas();
  syncAuto();
}

const detailModal      = document.getElementById('detail-modal');
const detailCard       = document.getElementById('detail-card');
const detailCatBadge   = document.getElementById('detail-cat-badge');
const detailCatLabel   = document.getElementById('detail-cat-label');
const detailTs         = document.getElementById('detail-ts');
const detailTextDisplay= document.getElementById('detail-text-display');
const detailEditInput  = document.getElementById('detail-edit-input');
const detailEditCatLabel = document.getElementById('detail-edit-cat-label');
const detailEditCatPickers = document.getElementById('detail-edit-cat-pickers');
const detailEditTagLabel = document.getElementById('detail-edit-tag-label');
const detailEditTagPickers = document.getElementById('detail-edit-tag-pickers');

const detailCopyBtn    = document.getElementById('detail-copy-btn');
const detailEditBtn    = document.getElementById('detail-edit-btn');
const detailSaveBtn    = document.getElementById('detail-save-btn');

let detailItemId = null;
let detailEditCatId = null;
let detailEditTagColor = null;
let detailIsEditing = false;

const SUB_TAG_COLORS = [
  { id:'red',    color:'#ffb3b3' },
  { id:'yellow', color:'#ffe7a0' },
  { id:'green',  color:'#b6f0c8' },
  { id:'blue',   color:'#a8d8f8' },
  { id:'purple', color:'#d4b3f8' },
];

function openDetailModal(itemId) {
  const item = history.find(h => h.id === itemId);
  if (!item) return;
  detailItemId = itemId;
  detailEditCatId = item.catId;
  detailEditTagColor = item.tagColor || null;
  detailIsEditing = false;

  const catData = cats.find(c => c.id === item.catId);
  detailCatBadge.textContent = catData?.emoji || '📌';
  detailCatBadge.style.background = catData ? colorToBg(catData.color) : colorToBg('#7c3aed');
  detailCatLabel.textContent = catData?.label || '未分類';
  const noteEl = canvasContainer.querySelector(`.sticky-note[data-id="${itemId}"]`);
  if (noteEl && catData?.color) {
    detailCard.style.borderLeftColor = catData.color;
  }

  const d = new Date(item.ts);
  detailTs.textContent = d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  detailTextDisplay.textContent = item.text || '(空メモ)';
  detailEditInput.value = item.text || '';

  detailTextDisplay.style.display = 'block';
  detailEditInput.style.display = 'none';
  detailEditCatLabel.style.display = 'none';
  detailEditCatPickers.style.display = 'none';
  detailEditTagLabel.style.display = 'none';
  detailEditTagPickers.style.display = 'none';
  detailCopyBtn.style.display = 'inline';
  detailEditBtn.style.display = 'inline';
  detailSaveBtn.style.display = 'none';

  // 付箋の位置・サイズを起点にアニメーション
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const targetW = Math.min(vw - 32, 360);
  const targetH = Math.min(vh * 0.7, 480);
  const targetL = (vw - targetW) / 2;
  const targetT = (vh - targetH) / 2;

  const card = detailCard;
  card.style.transition = 'none';
  card.style.opacity = '1';
  card.style.pointerEvents = 'all';
  card.style.transform = 'scale(1)';
  if (catData?.color) {
    card.style.background = lightenColor(catData.color, 0.12);
  } else {
    card.style.background = '#fff';
  }

  // 起点を付箋位置にセット
  if (noteEl) {
    const nr = noteEl.getBoundingClientRect();
    card.style.left      = nr.left + 'px';
    card.style.top       = nr.top  + 'px';
    card.style.width     = nr.width  + 'px';
    card.style.maxHeight = nr.height + 'px';
    card.style.borderRadius = '16px';
  } else {
    card.style.left      = targetL + 'px';
    card.style.top       = targetT + 'px';
    card.style.width     = targetW + 'px';
    card.style.maxHeight = targetH + 'px';
    card.style.borderRadius = '20px';
  }

  detailModal.classList.add('open');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    card.style.left        = targetL + 'px';
    card.style.top         = targetT + 'px';
    card.style.width       = targetW + 'px';
    card.style.maxHeight   = targetH + 'px';
    card.style.borderRadius = '20px';
  }));
}

function closeDetailModal() {
  const card = detailCard;
  card.style.transition = 'opacity 0.18s ease';
  card.style.opacity = '0';
  card.style.pointerEvents = 'none';

  detailModal.classList.remove('open');

  setTimeout(() => {
    card.style.transition = 'none';
    card.style.left = '-9999px';
  }, 200);

  detailEditInput.blur();
  detailItemId = null;
  detailIsEditing = false;
}

function enterEditMode() {
  detailIsEditing = true;
  detailCard.style.background = '#fff';
  detailTextDisplay.style.display = 'none';
  detailEditInput.style.display = 'block';
  detailEditCatLabel.style.display = 'block';
  detailEditCatPickers.style.display = 'grid';
  detailEditTagLabel.style.display = 'block';
  detailEditTagPickers.style.display = 'flex';
  detailCopyBtn.style.display = 'none';
  detailEditBtn.style.display = 'none';
  detailSaveBtn.style.display = 'block';

  // カテゴリ選択チップを生成
  detailEditCatPickers.innerHTML = '';
  cats.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'cat-chip';
    chip.style.borderLeft = `5px solid ${cat.color || '#7c3aed'}`;
    if (cat.id === detailEditCatId) chip.style.background = '#ede9fe';
    chip.innerHTML = `<span>${esc(cat.emoji)}</span><span>${esc(cat.label)}</span>`;
    chip.addEventListener('click', (e) => {
      e.stopPropagation();
      detailEditCatId = cat.id;
      detailEditCatPickers.querySelectorAll('.cat-chip').forEach(c => c.style.background = '#fff');
      chip.style.background = '#ede9fe';
    });
    detailEditCatPickers.appendChild(chip);
  });

  // タグ（ベロ）選択チップを生成
  detailEditTagPickers.innerHTML = '';
  const noneChip = document.createElement('button');
  noneChip.className = 'tag-chip-none' + (detailEditTagColor === null ? ' selected' : '');
  noneChip.textContent = '✕';
  noneChip.title = 'タグなし';
  noneChip.addEventListener('click', (e) => {
    e.stopPropagation();
    detailEditTagColor = null;
    detailEditTagPickers.querySelectorAll('.tag-chip, .tag-chip-none').forEach(c => c.classList.remove('selected'));
    noneChip.classList.add('selected');
  });
  detailEditTagPickers.appendChild(noneChip);
  SUB_TAG_COLORS.forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'tag-chip' + (detailEditTagColor === tag.color ? ' selected' : '');
    chip.style.background = tag.color;
    chip.addEventListener('click', (e) => {
      e.stopPropagation();
      detailEditTagColor = tag.color;
      detailEditTagPickers.querySelectorAll('.tag-chip, .tag-chip-none').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    });
    detailEditTagPickers.appendChild(chip);
  });

  setTimeout(() => detailEditInput.focus(), 100);
}

function saveDetailEdit() {
  const item = history.find(h => h.id === detailItemId);
  if (!item) return;

  item.text = detailEditInput.value.trim();
  item.tagColor = detailEditTagColor;

  const newCat = cats.find(c => c.id === detailEditCatId);
  if (newCat) {
    item.catId    = newCat.id;
    item.catLabel = newCat.label;
    item.catEmoji = newCat.emoji;
    item.catBg    = colorToBg(newCat.color);
  }

  localStorage.setItem('memo_history', JSON.stringify(history));
 
  renderCanvas();
  syncAuto();
  closeDetailModal();
}

detailCloseBtn.addEventListener('click', closeDetailModal);
detailCopyBtn.addEventListener('click', () => {
  const item = history.find(h => h.id === detailItemId);
  if (!item?.text) return;
  navigator.clipboard.writeText(item.text).then(() => {
    detailCopyBtn.textContent = '✓ コピー完了';
    setTimeout(() => detailCopyBtn.textContent = '📋 コピー', 1500);
  });
});
detailEditBtn.addEventListener('click', enterEditMode);
detailSaveBtn.addEventListener('click', saveDetailEdit);
detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetailModal(); });

function openTrashModal() {
  const folderEl = document.getElementById('folder-trash');

  const trashItems = history.filter(h => h.deleted);

  renderTrashList();

  const targetW = Math.min(vw - 32, 340);
  const targetH = Math.min(60 + trashItems.length * 80, vh * 0.65, 500);
  const targetL = (vw - targetW) / 2;
  const targetT = (vh - targetH) / 2;

  trashCard.style.transition = 'none';
  trashCard.style.opacity = '1';
  trashCard.style.pointerEvents = 'all';
  trashCard.style.left = fr.left + 'px'; trashCard.style.top = fr.top + 'px';

  trashCard.style.borderRadius = '18px';

  trashModal.classList.add('open');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    trashCard.style.left = targetL + 'px'; trashCard.style.top = targetT + 'px';
    trashCard.style.width = targetW + 'px'; trashCard.style.maxHeight = targetH + 'px';
    trashCard.style.borderRadius = '20px';
  }));

function closeTrashModal() {
  trashCard.style.transition = 'opacity 0.18s ease';
  trashCard.style.opacity = '0';
  trashCard.style.pointerEvents = 'none';
  trashModal.classList.remove('open');
  setTimeout(() => {
    trashCard.style.transition = 'none';
    trashCard.style.left = '-9999px';
  }, 200);
}

function renderTrashList() {
  const trashItems = history.filter(h => h.deleted);
  trashCardTitle.textContent = `🗑️ ゴミ箱 (${trashItems.length}件)`;
  if (!trashItems.length) {
    trashList.innerHTML = '<div id="trash-empty-state">ゴミ箱は空です</div>';
    return;
  }
  trashList.innerHTML = '';
  const now = Date.now();
  trashItems.forEach(item => {
    const catData = cats.find(c => c.id === item.catId);
    const deletedAt = new Date(item.deletedAt).getTime();
    const expiresAt = deletedAt + prefs.trashDays * 86400000;
    const daysLeft = Math.ceil((expiresAt - now) / 86400000);

    const row = document.createElement('div'); row.className = 'trash-item';
    const badge = document.createElement('div'); badge.className = 'trash-item-badge';
    badge.textContent = catData?.emoji || '📌';
    badge.style.background = catData ? colorToBg(catData.color) : colorToBg('#7c3aed');
    const body = document.createElement('div'); body.className = 'trash-item-body';
    const text = document.createElement('div'); text.className = 'trash-item-text';
    text.textContent = item.text || '(空メモ)';
    const expires = document.createElement('div'); expires.className = 'trash-item-expires';
    expires.textContent = daysLeft > 0 ? `あと${daysLeft}日で完全削除` : '本日削除予定';
    body.append(text, expires);

    const actions = document.createElement('div'); actions.className = 'trash-item-actions';

    const restoreBtn = document.createElement('button'); restoreBtn.className = 'trash-restore-btn';
    restoreBtn.textContent = '戻す';
    restoreBtn.addEventListener('click', () => {
      const rect = canvasContainer.getBoundingClientRect();
      const pos = calculateInitialPosition(item.catId, rect.width || 300, rect.height || 400);
      item.deleted = false; item.deletedAt = null; item.done = false; item.later = false;
      item.x = pos.x; item.y = pos.y;
      localStorage.setItem('memo_history', JSON.stringify(history));
     
      renderCanvas(); syncAuto();
      if (!history.filter(h => h.deleted).length) { closeTrashModal(); } else { renderTrashList(); }
    });

    const archiveBtn = document.createElement('button'); archiveBtn.className = 'trash-archive-btn';
    archiveBtn.textContent = '📥';
    archiveBtn.addEventListener('click', () => {
      item.deleted = false; item.deletedAt = null; item.done = true; item.later = false;
      localStorage.setItem('memo_history', JSON.stringify(history));
     
      renderCanvas(); syncAuto();
      if (!history.filter(h => h.deleted).length) { closeTrashModal(); } else { renderTrashList(); }
    });

    const deleteBtn = document.createElement('button'); deleteBtn.className = 'trash-delete-btn';
    deleteBtn.textContent = '🗑️';
    deleteBtn.addEventListener('click', () => {
      if (!confirm('完全に削除しますか？元に戻せません。')) return;
      history = history.filter(h => h.id !== item.id);
      localStorage.setItem('memo_history', JSON.stringify(history));
      if (!history.filter(h => h.deleted).length) { closeTrashModal(); } else { renderTrashList(); }
      syncAuto();
    });

    actions.append(restoreBtn, archiveBtn, deleteBtn);
    row.append(badge, body, actions);
    trashList.appendChild(row);
  });
}

// ── ゴミ箱 期限切れ自動削除 ──────────────────────────────────────────────────
function cleanupExpiredTrash() {
  const now = Date.now();
  const before = history.length;
  history = history.filter(h => {
    if (!h.deleted || !h.deletedAt) return true;
    return (new Date(h.deletedAt).getTime() + prefs.trashDays * 86400000) > now;
  });
  if (history.length !== before) {
    localStorage.setItem('memo_history', JSON.stringify(history));
  }
}

function createStickyNote(catId) {
  const text = memoInput.value.trim();

  const newItem = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),

    ts: new Date().toISOString(),
    done: false,
    later: false,
    x: pos.x,
    y: pos.y
  };

function makeField(label, type, value, placeholder, maxLen, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'field-group';
  const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = label;
  const inp = document.createElement('input'); inp.type = type; inp.className = 'field-input'; inp.value = value || ''; inp.placeholder = placeholder; inp.maxLength = maxLen;
  inp.addEventListener('input', () => onChange(inp.value));
  wrap.append(lbl, inp); return wrap;
}

function makeColorField(color, onChange) {
  const DEFAULTS = ['#059669','#18181b','#7c3aed','#ea580c','#db2777','#0ea5e9','#d97706'];
  const safeColor = isValidHex(color) ? color : '#7c3aed';
  const wrap = document.createElement('div'); wrap.className = 'field-group';
  const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = 'ベースカラー';
  const row = document.createElement('div'); row.className = 'color-field';
  const picker = document.createElement('input'); picker.type = 'color'; picker.className = 'color-picker'; picker.value = safeColor;
  const text = document.createElement('input'); text.type = 'text'; text.className = 'field-input color-hex'; text.value = safeColor; text.maxLength = 7;
  picker.addEventListener('input', () => { text.value = picker.value; onChange(picker.value); });
  text.addEventListener('input', () => { let v = text.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (isValidHex(v)) { picker.value = v; onChange(v); } });
  const presets = document.createElement('div'); presets.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;';
  DEFAULTS.forEach(c => {
    const dot = document.createElement('button'); dot.type = 'button'; dot.style.cssText = `width:20px;height:20px;border-radius:50%;background:${c};border:none;cursor:pointer;`;
    dot.addEventListener('click', () => { picker.value = c; text.value = c; onChange(c); }); presets.appendChild(dot);
  });
  row.append(picker, text); wrap.append(lbl, row, presets); return wrap;
}

function checkDailyItems() {
  if (!dailyItems.length) return;
  const adjustedNow = new Date();
  adjustedNow.setHours(adjustedNow.getHours() - 5);
  const todayAt5 = new Date(adjustedNow.getFullYear(), adjustedNow.getMonth(), adjustedNow.getDate(), 5, 0, 0);
  if (history.some(h => h.id.startsWith('daily-') && new Date(h.ts) >= todayAt5)) return;
  
  const baseTs = Date.now(); let added = 0;
  const rect = canvasContainer.getBoundingClientRect();
  const cWidth = rect.width || window.innerWidth - 24; const cHeight = rect.height || 400;

  dailyItems.forEach((item, i) => {
    if (!item.content?.trim()) return;
    const targetCat = cats.find(c => c.id === item.catId) || cats[0];
    const pos = calculateInitialPosition(targetCat?.id, cWidth, cHeight);

    history.unshift({
      id: `daily-${baseTs}-${i}`, catId: targetCat?.id || 'unclassified', catLabel: targetCat?.label || '未分類', catEmoji: targetCat?.emoji || '📌',
      catBg: targetCat ? colorToBg(targetCat.color) : colorToBg('#7c3aed'), text: item.content.trim(),
      done: false, later: false, ts: new Date(baseTs + i).toISOString(), x: pos.x, y: pos.y
    });
    added++;
  });
  if (!added) return;
  localStorage.setItem('memo_history', JSON.stringify(history));
  renderCanvas(); syncAuto();
}

function openHistory() { renderHistory(); historyPanel.classList.add('open'); if (syncConfig.token && syncConfig.gistId && !syncDebounceTimer) { syncPull().then(ok => { if (ok) renderHistory(); }); } }
function closeHistory() { historyPanel.classList.remove('open'); renderCanvas(); }

function renderHistory() {
  historyFiltersEl.innerHTML = '';
  if (history.length) {
    const doneSection = document.createElement('div'); doneSection.className = 'filter-section'; doneSection.innerHTML = '<div class="filter-label">状態フィルター</div>';
    const doneRow = document.createElement('div'); doneRow.className = 'filter-row';
    [['all','全て'], ['canvas','キャンバス上'], ['later','あとで保管中'], ['archive','アーカイブ済み']].forEach(([val, label]) => {
      const pill = document.createElement('button'); pill.className = 'filter-pill' + (historyFilter.done === val ? ' active' : ''); pill.textContent = label;
      pill.addEventListener('click', () => { historyFilter.done = val; renderHistory(); });
      doneRow.appendChild(pill);
    });
    doneSection.appendChild(doneRow); historyFiltersEl.appendChild(doneSection);

    const catSection = document.createElement('div'); catSection.className = 'filter-section'; catSection.innerHTML = '<div class="filter-label">カテゴリフィルター</div>';
    const catRow = document.createElement('div'); catRow.className = 'filter-row';
    const allPill = document.createElement('button'); allPill.className = 'filter-pill' + (historyFilter.catId === 'all' ? ' active' : ''); allPill.textContent = '全て';
    allPill.addEventListener('click', () => { historyFilter.catId = 'all'; renderHistory(); });
    catRow.appendChild(allPill);
    cats.forEach(cat => {
      const pill = document.createElement('button');
      pill.className = 'filter-pill' + (historyFilter.catId === cat.id ? ' active' : '');
      pill.innerHTML = `${esc(cat.emoji)} ${esc(cat.label)}`;
      if (historyFilter.catId === cat.id) { pill.style.background = cat.color; pill.style.borderColor = cat.color; }
      pill.addEventListener('click', () => { historyFilter.catId = cat.id; renderHistory(); });
      catRow.appendChild(pill);
    });
    catSection.appendChild(catRow); historyFiltersEl.appendChild(catSection);
  }

  if (!history.length) { historyList.innerHTML = '<div class="h-empty">履歴がありません</div>'; return; }

  let filtered = history;
  if (historyFilter.done === 'canvas')  filtered = filtered.filter(h => !h.done && !h.later);
  if (historyFilter.done === 'archive') filtered = filtered.filter(h => h.done);
  if (historyFilter.done === 'later')   filtered = filtered.filter(h => h.later);
  if (historyFilter.catId !== 'all')    filtered = filtered.filter(h => h.catId === historyFilter.catId);

  let html = ''; let lastDate = '';
  filtered.forEach(item => {
    const d = new Date(item.ts);
    const dateStr = d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
    if (dateStr !== lastDate) { html += `<div class="date-sep">${esc(dateStr)}</div>`; lastDate = dateStr; }
    
    const isDone = item.done;
    const stateBadge = item.later ? '⏳ あとで' : (isDone ? '✓ アーカイブ済' : '○ キャンバス');

    html += `
      <div class="h-item ${isDone ? 'done' : ''}">
        <div class="h-check ${isDone ? 'checked' : ''}" data-id="${esc(item.id)}">✓</div>
        <div class="h-badge" style="background:${esc(item.catBg || '#7c3aed')}">${esc(item.catEmoji || '📌')}</div>
        <div class="h-body">
          <div class="h-text">${esc(item.text || '(空メモ)')}</div>
          <div class="h-meta">${esc(item.catLabel || '未分類')} · ${esc(stateBadge)}</div>
        </div>
        <div class="h-action-btns">
          ${item.text ? `<button class="h-btn-small h-copy" data-id="${esc(item.id)}">📋</button>` : ''}
          <button class="h-btn-small h-del" data-id="${esc(item.id)}">🗑️</button>
        </div>
      </div>`;
  });
  historyList.innerHTML = html;

  // チェックボックス連動ロジック
  historyList.querySelectorAll('.h-check').forEach(chk => {
    chk.addEventListener('click', () => {
      const found = history.find(h => h.id === chk.dataset.id);
      if (found) {
        found.done = !found.done;
        found.later = false; 
        
        if (!found.done) {
          const rect = canvasContainer.getBoundingClientRect();
          const pos = calculateInitialPosition(found.catId, rect.width || 300, rect.height || 400);
          found.x = pos.x; found.y = pos.y;
        }

        localStorage.setItem('memo_history', JSON.stringify(history));
       
        renderHistory();
        syncAuto();
      }
    });
  });

  historyList.querySelectorAll('.h-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = history.find(h => h.id === btn.dataset.id);
      if (found?.text) { navigator.clipboard.writeText(found.text).then(() => { btn.textContent = '✓'; setTimeout(() => btn.textContent = '📋', 1200); }); }
    });
  });

  historyList.querySelectorAll('.h-del').forEach(btn => {
    btn.addEventListener('click', () => {
      history = history.filter(h => h.id !== btn.dataset.id);
      localStorage.setItem('memo_history', JSON.stringify(history));
      renderHistory(); syncAuto();
    });
  });
}

// ── JSON エクスポート ──────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  let target = history;
  if (historyFilter.done === 'canvas')  target = target.filter(h => !h.done && !h.later);
  if (historyFilter.done === 'archive') target = target.filter(h => h.done);
  if (historyFilter.done === 'later')   target = target.filter(h => h.later);
  if (historyFilter.catId !== 'all')    target = target.filter(h => h.catId === historyFilter.catId);

  if (!target.length) { alert('エクスポート対象のメモがありません'); return; }

  const stateLabel = { all:'全て', canvas:'キャンバス上', archive:'アーカイブ済み', later:'あとで保管中' }[historyFilter.done] || '全て';
  const catLabel = historyFilter.catId !== 'all' ? (cats.find(c => c.id === historyFilter.catId)?.label || '') : '';
  const filterDesc = catLabel ? `${stateLabel}・${catLabel}` : stateLabel;

  if (!confirm(`「${filterDesc}」${target.length}件をCSVでエクスポートしますか？`)) return;

  const rows = [['日時', '状態', 'カテゴリ', '内容']];
  target.forEach(h => {
    const state = h.done ? 'アーカイブ済み' : h.later ? 'あとで保管中' : 'キャンバス上';
    rows.push([new Date(h.ts).toLocaleString('ja-JP'), state, h.catLabel || '', `"${(h.text || '').replace(/"/g, '""')}"`]);
  });
  const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const suffix = catLabel ? `-${catLabel}` : '';
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `memo${suffix}-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(url);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  let target = history;
  if (historyFilter.done === 'canvas')  target = target.filter(h => !h.done && !h.later);
  if (historyFilter.done === 'archive') target = target.filter(h => h.done);
  if (historyFilter.done === 'later')   target = target.filter(h => h.later);
  if (historyFilter.catId !== 'all')    target = target.filter(h => h.catId === historyFilter.catId);

  if (!target.length) { alert('削除対象のメモがありません'); return; }

  const stateLabel = { all:'全て', canvas:'キャンバス上', archive:'アーカイブ済み', later:'あとで保管中' }[historyFilter.done] || '全て';
  const catLabel = historyFilter.catId !== 'all' ? (cats.find(c => c.id === historyFilter.catId)?.label || '') : '';

});

document.getElementById('import-choice-append').addEventListener('click', () => {

  const data = _importPendingData;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── PWA ──────────────────────────────────────────────────────────────────────
function setupPWA() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const ctx = c.getContext('2d');

  // 背景グラデーション（紫→ピンク）
  const g = ctx.createLinearGradient(0, 0, 512, 512);
  g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#ec4899');
  const r = 100; ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(512 - r, 0); ctx.quadraticCurveTo(512, 0, 512, r); ctx.lineTo(512, 512 - r); ctx.quadraticCurveTo(512, 512, 512 - r, 512); ctx.lineTo(r, 512); ctx.quadraticCurveTo(0, 512, 0, 512 - r); ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();

  // メモ帳本体（白）
  const mx = 120, my = 130, mw = 272, mh = 300, mr = 28;
  ctx.beginPath(); ctx.moveTo(mx + mr, my); ctx.lineTo(mx + mw - mr, my); ctx.quadraticCurveTo(mx + mw, my, mx + mw, my + mr); ctx.lineTo(mx + mw, my + mh - mr); ctx.quadraticCurveTo(mx + mw, my + mh, mx + mw - mr, my + mh); ctx.lineTo(mx + mr, my + mh); ctx.quadraticCurveTo(mx, my + mh, mx, my + mh - mr); ctx.lineTo(mx, my + mr); ctx.quadraticCurveTo(mx, my, mx + mr, my); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fill();

  // テキスト行
  const lineX = 158, lineW1 = 196, lineW2 = 155, lineW3 = 176, lineW4 = 120, lineH = 18, lineR = 9;
  const drawLine = (y, w, color, alpha = 1) => {
    ctx.beginPath(); ctx.moveTo(lineX + lineR, y); ctx.lineTo(lineX + w - lineR, y); ctx.quadraticCurveTo(lineX + w, y, lineX + w, y + lineH); ctx.lineTo(lineX + w, y + lineH); ctx.quadraticCurveTo(lineX + w, y + lineH + lineH, lineX + w - lineR, y + lineH + lineH - lineH); ctx.lineTo(lineX + lineR, y + lineH); ctx.quadraticCurveTo(lineX, y + lineH, lineX, y); ctx.closePath();
    ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.fill(); ctx.globalAlpha = 1;
  };
  // 太い1行目
  ctx.beginPath(); ctx.roundRect(lineX, 210, lineW1, 22, 11); ctx.fillStyle = '#7c3aed'; ctx.fill();
  // 細い行
  ctx.beginPath(); ctx.roundRect(lineX, 252, lineW2, 16, 8); ctx.fillStyle = '#c4b5fd'; ctx.fill();
  ctx.beginPath(); ctx.roundRect(lineX, 284, lineW3, 16, 8); ctx.fillStyle = '#c4b5fd'; ctx.fill();
  ctx.beginPath(); ctx.roundRect(lineX, 316, lineW4, 16, 8); ctx.fillStyle = '#c4b5fd'; ctx.globalAlpha = 0.7; ctx.fill(); ctx.globalAlpha = 1;

  // ピン（左）
  ctx.beginPath(); ctx.roundRect(186, 88, 40, 68, 20); ctx.fillStyle = '#ec4899'; ctx.fill();
  // ピン（右）
  ctx.beginPath(); ctx.roundRect(246, 88, 40, 68, 20); ctx.fillStyle = '#f9a8d4'; ctx.fill();

  const iconURL = c.toDataURL('image/png'); document.getElementById('apple-icon').href = iconURL;
  const manifest = { name: 'はるメモ', short_name: 'はるメモ', start_url: './', display: 'standalone', background_color: '#f3f0ff', theme_color: '#7c3aed', orientation: 'portrait-primary', lang: 'ja', icons: [{ src: iconURL, sizes: '512x512', type: 'image/png' }] };
  document.getElementById('pwa-manifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
}

// ── GitHub Gist Sync ──────────────────────────────────────────────────────────
let syncConfig = JSON.parse(localStorage.getItem('memo_sync') || '{}');
let syncDebounceTimer = null;

function setSyncStatus(msg) { const el = document.getElementById('sync-status'); if (el) el.textContent = msg; }
async function gistReq(method, path, body) {
  const res = await fetch(`https://api.github.com${path}`, { method, headers: { 'Authorization': `token ${syncConfig.token}`, 'Accept': 'application/vnd.github.v3+json', ...(body ? { 'Content-Type': 'application/json' } : {}) }, ...(body ? { body: JSON.stringify(body) } : {}) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json();
}
function buildSyncPayload() { return JSON.stringify({ cats, history, prefs, dailyItems, dailyItemsSavedAt: localStorage.getItem('memo_daily_saved')||'', savedAt: new Date().toISOString() }, null, 2); }

async function syncPush() {
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl?.value.trim()) syncConfig.token = tokenEl.value.trim(); if (!syncConfig.token) { setSyncStatus('⚠ 未設定'); return; }
  setSyncStatus('送信中…');
  try {
    const content = buildSyncPayload();
    if (syncConfig.gistId) { await gistReq('PATCH', `/gists/${syncConfig.gistId}`, { files: { 'memo-sync.json': { content } } }); }
    else {
      const res = await gistReq('POST', '/gists', { description: '超特急メモ同期データ', public: false, files: { 'memo-sync.json': { content } } });
      syncConfig.gistId = res.id;
    }
    syncConfig.lastSync = new Date().toISOString(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig));
    if (gistEl && syncConfig.gistId) gistEl.value = syncConfig.gistId;
    setSyncStatus(`✓ 送信完了 ${new Date().toLocaleTimeString('ja-JP')}`);
  } catch (e) { setSyncStatus(`⚠ エラー: ${e.message}`); }
}

async function syncPull() {
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl?.value.trim()) syncConfig.token = tokenEl.value.trim(); if (gistEl?.value.trim()) syncConfig.gistId = gistEl.value.trim();
  if (!syncConfig.token || !syncConfig.gistId) { setSyncStatus('⚠ 未入力あり'); return false; }
  setSyncStatus('取得中…');
  try {
    const gist = await gistReq('GET', `/gists/${syncConfig.gistId}`);
    const raw = gist.files?.['memo-sync.json']?.content; if (!raw) throw new Error('データ空');
    const data = JSON.parse(raw);
    if (data.cats) { cats = data.cats; localStorage.setItem('memo_cats', JSON.stringify(cats)); }
    if (data.history) { history = data.history; localStorage.setItem('memo_history', JSON.stringify(history)); }
    if (data.prefs) { prefs = data.prefs; localStorage.setItem('memo_prefs', JSON.stringify(prefs)); }
    if (data.dailyItems) { dailyItems = data.dailyItems; localStorage.setItem('memo_daily', JSON.stringify(dailyItems)); }
    syncConfig.lastSync = new Date().toISOString(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig));
    setSyncStatus(`✓ 同期完了 ${new Date().toLocaleTimeString('ja-JP')}`); renderCanvas(); return true;
  } catch (e) { setSyncStatus(`⚠ エラー: ${e.message}`); return false; }
}

function syncAuto() { if (!syncConfig.token) return; clearTimeout(syncDebounceTimer); syncDebounceTimer = setTimeout(() => { syncDebounceTimer = null; syncPush(); }, 3000); }

const _origOpenSettings = openSettings;
openSettings = function() {
  _origOpenSettings();
  const tokenEl = document.getElementById('sync-token'); const gistEl = document.getElementById('sync-gist-id');
  if (tokenEl && syncConfig.token) tokenEl.value = syncConfig.token; if (gistEl && syncConfig.gistId) gistEl.value = syncConfig.gistId;
  if (syncConfig.lastSync) setSyncStatus(`最終同期: ${new Date(syncConfig.lastSync).toLocaleTimeString('ja-JP')}`);
};

document.getElementById('sync-token').addEventListener('input', e => { syncConfig.token = e.target.value.trim(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); });
document.getElementById('sync-gist-id').addEventListener('input', e => { syncConfig.gistId = e.target.value.trim(); localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); });
document.getElementById('sync-push-btn').addEventListener('click', syncPush);
document.getElementById('sync-pull-btn').addEventListener('click', async () => { const ok = await syncPull(); if (ok) { renderCanvas(); renderHistory(); } });
document.getElementById('sync-reset-btn').addEventListener('click', () => { if (!confirm('データIDをリセットしますか？')) return; syncConfig.gistId = ''; localStorage.setItem('memo_sync', JSON.stringify(syncConfig)); document.getElementById('sync-gist-id').value = ''; setSyncStatus('リセット完了'); });
document.getElementById('copy-gist-btn').addEventListener('click', () => { const id = document.getElementById('sync-gist-id').value; if (!id) return; navigator.clipboard.writeText(id).then(() => { const b = document.getElementById('copy-gist-btn'); b.textContent = '✓'; setTimeout(() => b.textContent = '📋', 1500); }); });

// ── Init ─────────────────────────────────────────────────────────────────────
const buildStamp = new Date(document.lastModified).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
document.getElementById('build-stamp').textContent = `build: ${buildStamp}`;

setupPWA(); renderCanvas();
cleanupExpiredTrash();
if (syncConfig.token && syncConfig.gistId) { syncPull().then(ok => { checkDailyItems(); }); } else { checkDailyItems(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    localStorage.setItem('memo_history', JSON.stringify(history));
  } else if (syncConfig.token && syncConfig.gistId) {
    syncPull();
  }
});
